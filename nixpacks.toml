[phases.setup]
nixPkgs = ["python311", "nodejs_20", "curl"]

[phases.install]
cmds = [
    "npm install",
    "curl https://bootstrap.pypa.io/get-pip.py -o get-pip.py",
    "python3 get-pip.py --break-system-packages",
    "python3 -m pip install -r requirements.txt --break-system-packages"
]

[start]
cmd = "npm start"